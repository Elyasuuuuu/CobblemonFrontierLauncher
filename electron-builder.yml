# appId : à ne jamais changer, même si le domaine a changé (cobblemon-frontier.fr) : l'installeur Windows s'en sert
# pour reconnaître l'installation existante, et les mises à jour automatiques casseraient.
appId: 'fr.bytesafe.cobblemonfrontierlauncher'
productName: 'Cobblemon Frontier Launcher'
artifactName: 'CobblemonFrontierLauncher-setup-${version}.${ext}'

# La notice MIT d'origine (Daniel Scalzi, Helios Launcher) reste dans LICENSE.txt, livré avec l'application : la licence l'exige.
copyright: 'Copyright © 2026 Cobblemon Frontier'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'
  # React/Vite source and dev tooling -- only the build OUTPUT (app/preload-dist,
  # app/assets/react) ships, never the src/ it's built from.
  - '!{src,tailwind.config.js,postcss.config.js,vite.config.mjs,electron.vite.config.mjs}'
  # Pre-existing untracked debug scripts at the repo root, not meant to ship.
  - '!{cdp_alerttest.js,cdp_menu.js,cdp_verify.js}'

# Mises à jour automatiques : le launcher installé lit latest.yml (Windows) /
# latest-linux.yml (Linux) dans ce dossier. Publier une version = y copier
# l'installeur, son .blockmap et le latest*.yml générés dans dist/.
publish:
  provider: generic
  url: 'https://cobblemon-frontier.fr/cobblemon-launcher/launcher-builds/'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Cobblemon Frontier'
  vendor: 'Cobblemon Frontier'
  synopsis: 'Launcher du serveur Cobblemon Frontier'
  description: 'Launcher officiel du serveur Minecraft Cobblemon Frontier : installe le jeu, les mods et les mises à jour tout seul.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'